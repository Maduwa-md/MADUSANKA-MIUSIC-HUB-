<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MADUSANKA MIUSIC HUB</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
min-height:100vh;color:white;
background:
linear-gradient(#0009,#160020cc),
url("background.jpg") center/cover fixed;
}
.login,.app{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.box{
width:100%;max-width:900px;
background:#111b;
backdrop-filter:blur(15px);
border:1px solid #fff2;
border-radius:25px;
padding:25px;
box-shadow:0 15px 50px #000
}
.login .box{text-align:center;max-width:400px}
.logo{
font-size:clamp(28px,7vw,50px);
font-weight:900;
text-align:center;
text-shadow:0 0 15px #a000ff,0 0 30px #ff1493
}
input{
width:100%;padding:14px;
margin:7px 0;
border:1px solid #fff2;
border-radius:13px;
background:#ffffff12;
color:white;
outline:none
}
button{
border:0;
padding:12px 17px;
border-radius:13px;
background:linear-gradient(135deg,#8500ff,#ff1493);
color:white;font-weight:bold;
cursor:pointer
}
header{text-align:center;margin-bottom:20px}
.controls,.top{
display:flex;gap:10px;flex-wrap:wrap;
justify-content:center;margin:15px 0
}
.top input{flex:1;min-width:200px}
.cover{
width:210px;height:210px;
margin:10px auto 18px;
border-radius:22px;
background:url("cover.jpg") center/cover #222;
box-shadow:0 0 35px #8b00ff;
display:flex;align-items:center;justify-content:center;
font-size:65px
}
.title{text-align:center;font-size:23px;font-weight:bold}
.artist{text-align:center;color:#aaa;margin:6px}
audio{width:100%;margin-top:15px}
.volume{
display:flex;align-items:center;
justify-content:center;gap:10px
}
.volume input{max-width:250px}
.visualizer{
height:70px;display:flex;
align-items:end;justify-content:center;
gap:4px;margin:15px
}
.bar{
width:6px;height:10px;border-radius:10px;
background:linear-gradient(#ff00d4,#7300ff);
animation:bounce .6s infinite alternate;
animation-play-state:paused
}
.playing .bar{animation-play-state:running}
@keyframes bounce{to{height:65px}}
.song{
display:flex;justify-content:space-between;
padding:14px;margin:7px 0;
border-radius:13px;background:#ffffff0d;
cursor:pointer
}
.song:hover,.active{background:#8500ff55}
.like.active{background:#ff146e}
footer{text-align:center;color:#888;margin-top:20px}
.hidden{display:none!important}

@media(max-width:600px){
.box{padding:16px}
.cover{width:175px;height:175px}
.top{flex-direction:column}
.top input,button{width:100%}
.controls button{width:100%}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
<div class="box">

<div class="logo">🎵</div>
<h2 style="text-align:center;margin:15px">
MADUSANKA MIUSIC HUB
</h2>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()" style="width:100%">
🔐 LOGIN
</button>

<p id="msg" style="color:#ff6b9f;margin-top:10px"></p>

</div>
</div>


<!-- APP -->
<div id="app" class="app hidden">
<div class="box">

<header>
<div class="logo">🎵 MADUSANKA MIUSIC HUB</div>
<p style="color:#bbb;margin-top:8px">
Your Music • Your Vibe • Your Hub
</p>
</header>


<!-- SEARCH -->
<div class="top">

<input
id="search"
placeholder="🔍 Search songs..."
oninput="showSongs()">

<button onclick="logout()">Logout</button>

</div>


<!-- PLAYER -->
<div class="cover">🎵</div>

<div id="title" class="title">
Select a Song
</div>

<div class="artist">
MADUSANKA MIUSIC HUB
</div>


<!-- VISUALIZER -->
<div id="visualizer" class="visualizer"></div>


<audio id="player" controls></audio>


<!-- BUTTONS -->
<div class="controls">

<button onclick="previous()">⏮ Previous</button>

<button id="like" class="like"
onclick="likeSong()">♡ Like</button>

<button onclick="next()">Next ⏭</button>

</div>


<!-- VOLUME -->
<div class="volume">

🔊

<input
id="volume"
type="range"
min="0"
max="1"
step=".01"
value="1">

<span id="vol">100%</span>

</div>


<!-- PLAYLIST -->
<h2 style="margin-top:20px">
🎧 Playlist
</h2>

<div id="songs"></div>


<footer>
© 2026 MADUSANKA MIUSIC HUB
</footer>

</div>
</div>


<script>

/* ===================================
   🎵 YOUR GITHUB SONGS
   =================================== */

const music = [

{
name:"My Song 01",
file:"music/song1.mp3"
},

{
name:"My Song 02",
file:"music/song2.mp3"
},

{
name:"My Song 03",
file:"music/song3.mp3"
},

{
name:"My Song 04",
file:"music/song4.mp3"
},

{
name:"My Song 05",
file:"music/song5.mp3"
}

];


/* VARIABLES */

let current=-1;
let likes=new Set();

const player=document.getElementById("player");
const title=document.getElementById("title");
const list=document.getElementById("songs");
const like=document.getElementById("like");
const search=document.getElementById("search");
const visualizer=document.getElementById("visualizer");


/* VISUALIZER */

for(let i=0;i<30;i++){

let b=document.createElement("div");

b.className="bar";

b.style.animationDelay=
(i*.04)+"s";

visualizer.appendChild(b);

}


/* LOGIN */

function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(!u||!p){

document.getElementById("msg").innerText=
"Username සහ Password දාන්න.";

return;

}

document.getElementById("login")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

showSongs();

}


/* LOGOUT */

function logout(){

document.getElementById("app")
.classList.add("hidden");

document.getElementById("login")
.classList.remove("hidden");

}


/* SHOW SONGS */

function showSongs(){

let q=search.value.toLowerCase();

list.innerHTML="";

music.forEach((song,i)=>{

if(!song.name.toLowerCase().includes(q))
return;

let div=document.createElement("div");

div.className=
"song "+(i===current?"active":"");

div.onclick=()=>load(i);

div.innerHTML=
`
<span>
${likes.has(i)?"❤️":"🎵"}
 ${song.name}
</span>
`;

list.appendChild(div);

});

}


/* LOAD */

function load(i){

current=i;

player.src=music[i].file;

title.innerText=music[i].name;

player.play();

updateLike();

showSongs();

}


/* NEXT */

function next(){

if(!music.length)return;

let i=current+1;

if(i>=music.length)i=0;

load(i);

}


/* PREVIOUS */

function previous(){

if(!music.length)return;

let i=current-1;

if(i<0)i=music.length-1;

load(i);

}


/* LIKE */

function likeSong(){

if(current<0)return;

if(likes.has(current))
likes.delete(current);
else
likes.add(current);

updateLike();

showSongs();

}


/* LIKE BUTTON */

function updateLike(){

if(likes.has(current)){

like.innerText="♥ Liked";
like.classList.add("active");

}else{

like.innerText="♡ Like";
like.classList.remove("active");

}

}


/* VOLUME */

document.getElementById("volume")
.oninput=function(){

player.volume=this.value;

document.getElementById("vol")
.innerText=
Math.round(this.value*100)+"%";

};


/* VISUALIZER */

player.onplay=()=>{
visualizer.classList.add("playing");
};

player.onpause=()=>{
visualizer.classList.remove("playing");
};


/* AUTO NEXT */

player.onended=()=>{
next();
};

</script>

</body>
</html>
