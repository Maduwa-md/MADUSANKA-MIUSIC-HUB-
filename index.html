<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MADUSANKA MIUSIC HUB</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:white;

    background:
    linear-gradient(
        rgba(0,0,0,.72),
        rgba(25,0,40,.86)
    ),
    url("file_0000000044ac81faa36c9dc27ef5a2e6.png")
    center/cover fixed no-repeat;
}

.container{
    width:94%;
    max-width:950px;
    margin:auto;
    padding:20px 0 40px;
}

header{
    text-align:center;
    padding:15px 0 25px;
}

.logo{
    font-size:clamp(28px,7vw,50px);
    font-weight:900;

    text-shadow:
    0 0 15px #a000ff,
    0 0 30px #ff1493;
}

.subtitle{
    color:#bbb;
    margin-top:8px;
}

.card{
    background:rgba(15,15,25,.78);
    backdrop-filter:blur(15px);

    border:1px solid #ffffff20;

    border-radius:25px;

    padding:20px;
    margin-bottom:18px;

    box-shadow:0 15px 50px #000;
}


/* SEARCH */

.topbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:200px;
}

.input{
    width:100%;
    padding:14px;

    border:1px solid #ffffff20;

    border-radius:13px;

    background:#ffffff10;

    color:white;

    outline:none;
}

.input::placeholder{
    color:#aaa;
}


/* BUTTONS */

button,
.upload{
    border:0;

    padding:12px 17px;

    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #8500ff,
        #ff1493
    );

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover,
.upload:hover{
    transform:scale(1.03);
}

.upload{
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.upload input{
    display:none;
}


/* COVER */

.cover{
    width:210px;
    height:210px;

    margin:10px auto 18px;

    border-radius:22px;

    background:
    url("cover.jpg")
    center/cover no-repeat;

    box-shadow:
    0 0 35px #8500ff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:65px;
}

.title{
    text-align:center;

    font-size:23px;

    font-weight:bold;

    word-break:break-word;
}

.artist{
    text-align:center;
    color:#aaa;
    margin:7px;
}


/* AUDIO */

audio{
    width:100%;
    margin-top:15px;
}


/* PROGRESS */

.progress-area{
    display:flex;

    align-items:center;

    gap:9px;

    margin:15px 0;
}

.progress-area span{
    min-width:42px;

    text-align:center;

    font-size:13px;

    color:#ccc;
}

#progressBar{
    flex:1;

    height:6px;

    cursor:pointer;

    accent-color:#b000ff;
}


/* VISUALIZER */

.visualizer{
    height:75px;

    display:flex;

    align-items:end;

    justify-content:center;

    gap:4px;

    margin:15px auto;
}

.bar{
    width:6px;

    height:10px;

    border-radius:10px;

    background:
    linear-gradient(
        #ff00d4,
        #7300ff
    );

    animation:
    bounce .55s infinite alternate;

    animation-play-state:paused;
}

.playing .bar{
    animation-play-state:running;
}

@keyframes bounce{

    from{
        height:10px;
    }

    to{
        height:65px;
    }

}


/* CONTROLS */

.controls{
    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:10px;

    margin:15px 0;
}

.like{
    background:#302035;
}

.like.active{
    background:#ff146e;
}


/* VOLUME */

.volume{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    margin:15px;
}

.volume input{
    width:220px;
}


/* PLAYLIST */

.playlist{
    margin-top:25px;
}

.playlist h2{
    margin-bottom:12px;
}

.song{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:14px;

    margin:7px 0;

    border-radius:14px;

    background:#ffffff0c;

    border:1px solid #ffffff10;

    cursor:pointer;

    transition:.2s;
}

.song:hover,
.song.active{
    background:#8500ff55;
}

.song-name{
    flex:1;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.song-actions{
    display:flex;
    gap:6px;
}

.mini-btn{
    padding:7px 10px;

    border-radius:9px;

    background:#333;

    font-size:14px;
}

.mini-btn:hover{
    background:#555;
}

.empty{
    text-align:center;
    color:#888;
    padding:20px;
}


/* STATUS */

#status{
    text-align:center;
    color:#aaa;
    margin-top:12px;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        width:94%;
    }

    .card{
        padding:16px;
        border-radius:20px;
    }

    .logo{
        font-size:28px;
    }

    .cover{
        width:175px;
        height:175px;
    }

    .topbar{
        flex-direction:column;
    }

    .search,
    .topbar button,
    .upload{
        width:100%;
    }

    .controls{
        flex-direction:column;
    }

    .controls button{
        width:100%;
    }

    .volume input{
        width:170px;
    }

}

footer{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:20px;
}

</style>
</head>


<body>

<div class="container">

<header>

    <div class="logo">
        🎵 MADUSANKA MIUSIC HUB
    </div>

    <div class="subtitle">
        Your Music • Your Vibe • Your Hub
    </div>

</header>


<!-- SEARCH + ADD -->

<div class="card">

    <div class="topbar">

        <input
            id="search"
            class="input search"
            type="search"
            placeholder="🔍 Search songs..."
        >


        <label class="upload">

            🎵 Add Songs

            <input
                id="fileInput"
                type="file"
                accept="audio/*"
                multiple
            >

        </label>

    </div>


    <p id="status">
        Connecting to music library...
    </p>

</div>



<!-- PLAYER -->

<div class="card">

    <div class="cover">
        🎵
    </div>


    <div
        id="songTitle"
        class="title"
    >
        🎧 Select a Song
    </div>


    <div class="artist">
        MADUSANKA MIUSIC HUB
    </div>


    <!-- VISUALIZER -->

    <div
        id="visualizer"
        class="visualizer"
    ></div>


    <!-- AUDIO -->

    <audio
        id="player"
        controls
    ></audio>


    <!-- PROGRESS -->

    <div class="progress-area">

        <span id="currentTime">
            0:00
        </span>

        <input
            id="progressBar"
            type="range"
            min="0"
            max="100"
            value="0"
        >

        <span id="duration">
            0:00
        </span>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            onclick="previousSong()"
        >
            ⏮ Previous
        </button>


        <button
            id="likeButton"
            class="like"
            onclick="likeSong()"
        >
            ♡ Like
        </button>


        <button
            onclick="nextSong()"
        >
            Next ⏭
        </button>


        <button
            onclick="downloadSong()"
        >
            ⬇️ Download
        </button>

    </div>


    <!-- VOLUME -->

    <div class="volume">

        🔊

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

        <span id="volumeText">
            100%
        </span>

    </div>


    <!-- PLAYLIST -->

    <div class="playlist">

        <h2>
            🎧 Songs
        </h2>

        <div id="songList"></div>

    </div>

</div>


<footer>
    © 2026 MADUSANKA MIUSIC HUB
</footer>

</div>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://xxvmxqjbruprrisoepin.supabase.co";

const SUPABASE_KEY =
"sb_publishable_mNLrOWuKESlOiJrVFKKLhA_Ao7csJQu";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let songs = [];

let currentSong = -1;

let likedSongs = new Set();


const player =
document.getElementById("player");

const songTitle =
document.getElementById("songTitle");

const songList =
document.getElementById("songList");

const search =
document.getElementById("search");

const status =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");

const currentTime =
document.getElementById("currentTime");

const duration =
document.getElementById("duration");

const visualizer =
document.getElementById("visualizer");

const likeButton =
document.getElementById("likeButton");


/* =====================================================
   VISUALIZER BARS
===================================================== */

for(let i=0;i<30;i++){

    const bar =
    document.createElement("div");

    bar.className="bar";

    bar.style.animationDelay =
    (i * 0.04) + "s";

    visualizer.appendChild(bar);

}


/* =====================================================
   GET SONGS
===================================================== */

async function loadSongs(){

    status.innerText =
    "🎵 Loading songs...";


    const result =
    await supabaseClient
    .storage
    .from("music")
    .list(
        "",
        {
            limit:100,
            sortBy:{
                column:"name",
                order:"asc"
            }
        }
    );


    if(result.error){

        console.error(
            result.error
        );

        status.innerText =
        "❌ Songs load කරන්න බැරි වුණා.";

        return;

    }


    songs = [];


    result.data.forEach(
        file => {

            const name =
            file.name.toLowerCase();


            if(
                name.endsWith(".mp3") ||
                name.endsWith(".wav") ||
                name.endsWith(".m4a") ||
                name.endsWith(".ogg")
            ){

                const publicUrl =
                supabaseClient
                .storage
                .from("music")
                .getPublicUrl(
                    file.name
                )
                .data
                .publicUrl;


                songs.push({

                    name:
                    file.name.replace(
                        /\.[^/.]+$/,
                        ""
                    ),

                    file:
                    publicUrl

                });

            }

        }
    );


    status.innerText =
    "🎵 " +
    songs.length +
    " songs available";


    showSongs();

}



/* =====================================================
   ADD / UPLOAD SONGS
===================================================== */

document.getElementById(
    "fileInput"
)
.addEventListener(
    "change",
    async function(){

        const files =
        Array.from(this.files);


        if(!files.length){
            return;
        }


        for(const file of files){

            status.innerText =
            "⬆️ Uploading: " +
            file.name;


            const cleanName =
            file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


            const result =
            await supabaseClient
            .storage
            .from("music")
            .upload(
                cleanName,
                file,
                {
                    upsert:true,
                    contentType:file.type
                }
            );


            if(result.error){

                console.error(
                    result.error
                );


                alert(
                    "Upload failed:\n" +
                    result.error.message
                );

            }

        }


        status.innerText =
        "✅ Upload complete";


        await loadSongs();


        this.value="";

    }
);



/* =====================================================
   SHOW SONGS
===================================================== */

function showSongs(){

    const query =
    search.value
    .trim()
    .toLowerCase();


    songList.innerHTML="";


    let found=0;


    songs.forEach(
        (song,index)=>{

            if(
                !song.name
                .toLowerCase()
                .includes(query)
            ){
                return;
            }


            found++;


            const row =
            document.createElement("div");


            row.className =
            "song " +
            (
                index === currentSong
                ? "active"
                : ""
            );


            const name =
            document.createElement("span");


            name.className =
            "song-name";


            name.innerText =
            (
                likedSongs.has(index)
                ? "❤️ "
                : "🎵 "
            )
            +
            song.name;


            name.onclick =
            function(){

                loadSong(index);

            };


            const actions =
            document.createElement("div");


            actions.className =
            "song-actions";


            const download =
            document.createElement("button");


            download.className =
            "mini-btn";


            download.innerText =
            "⬇️";


            download.onclick =
            function(event){

                event.stopPropagation();

                downloadSongByIndex(
                    index
                );

            };


            actions.appendChild(
                download
            );


            row.appendChild(name);

            row.appendChild(actions);


            songList.appendChild(row);

        }
    );


    if(found===0){

        songList.innerHTML =
        `
        <div class="empty">
            🎵 No songs found
        </div>
        `;

    }

}



/* =====================================================
   LOAD SONG
===================================================== */

function loadSong(index){

    if(!songs[index]){
        return;
    }


    currentSong =
    index;


    player.src =
    songs[index].file;


    songTitle.innerText =
    songs[index].name;


    progressBar.value=0;


    currentTime.innerText =
    "0:00";


    duration.innerText =
    "0:00";


    updateLike();


    showSongs();


    player.play()
    .catch(
        error=>{
            console.log(
                "Play waiting:",
                error
            );
        }
    );

}



/* =====================================================
   NEXT
===================================================== */

function nextSong(){

    if(!songs.length){
        return;
    }


    let index =
    currentSong + 1;


    if(index >= songs.length){

        index=0;

    }


    loadSong(index);

}



/* =====================================================
   PREVIOUS
===================================================== */

function previousSong(){

    if(!songs.length){
        return;
    }


    let index =
    currentSong - 1;


    if(index < 0){

        index =
        songs.length - 1;

    }


    loadSong(index);

}



/* =====================================================
   LIKE
===================================================== */

function likeSong(){

    if(currentSong < 0){
        return;
    }


    if(
        likedSongs.has(
            currentSong
        )
    ){

        likedSongs.delete(
            currentSong
        );

    }
    else{

        likedSongs.add(
            currentSong
        );

    }


    updateLike();

    showSongs();

}



/* =====================================================
   LIKE BUTTON
===================================================== */

function updateLike(){

    if(
        likedSongs.has(
            currentSong
        )
    ){

        likeButton.innerText =
        "♥ Liked";

        likeButton.classList.add(
            "active"
        );

    }
    else{

        likeButton.innerText =
        "♡ Like";

        likeButton.classList.remove(
            "active"
        );

    }

}



/* =====================================================
   DOWNLOAD
===================================================== */

function downloadSong(){

    if(currentSong < 0){

        alert(
            "මුලින් සින්දුවක් select කරන්න 🎵"
        );

        return;

    }


    downloadSongByIndex(
        currentSong
    );

}


function downloadSongByIndex(index){

    if(!songs[index]){
        return;
    }


    const link =
    document.createElement("a");


    link.href =
    songs[index].file;


    link.download =
    songs[index].name +
    ".mp3";


    link.target="_blank";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );

}



/* =====================================================
   PROGRESS BAR
===================================================== */

player.addEventListener(
    "timeupdate",
    function(){

        if(
            !isNaN(player.duration) &&
            player.duration > 0
        ){

            const percent =
            (
                player.currentTime /
                player.duration
            ) * 100;


            progressBar.value =
            percent;


            currentTime.innerText =
            formatTime(
                player.currentTime
            );

        }

    }
);


player.addEventListener(
    "loadedmetadata",
    function(){

        if(
            !isNaN(player.duration)
        ){

            duration.innerText =
            formatTime(
                player.duration
            );

        }

    }
);


progressBar.addEventListener(
    "input",
    function(){

        if(
            player.duration &&
            !isNaN(player.duration)
        ){

            player.currentTime =
            (
                progressBar.value /
                100
            )
            *
            player.duration;

        }

    }
);



/* =====================================================
   TIME
===================================================== */

function formatTime(seconds){

    if(isNaN(seconds)){
        return "0:00";
    }


    let minutes =
    Math.floor(
        seconds / 60
    );


    let secondsPart =
    Math.floor(
        seconds % 60
    );


    if(secondsPart < 10){

        secondsPart =
        "0" +
        secondsPart;

    }


    return (
        minutes +
        ":" +
        secondsPart
    );

}



/* =====================================================
   VOLUME
===================================================== */

document.getElementById(
    "volume"
)
.addEventListener(
    "input",
    function(){

        player.volume =
        this.value;


        document.getElementById(
            "volumeText"
        ).innerText =
        Math.round(
            this.value * 100
        ) +
        "%";

    }
);



/* =====================================================
   VISUALIZER
===================================================== */

player.addEventListener(
    "play",
    function(){

        visualizer.classList.add(
            "playing"
        );

    }
);


player.addEventListener(
    "pause",
    function(){

        visualizer.classList.remove(
            "playing"
        );

    }
);


/* =====================================================
   AUTO NEXT
===================================================== */

player.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);



/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
    "input",
    function(){

        showSongs();

    }
);



/* =====================================================
   START
===================================================== */

loadSongs();

</script>

</body>
  </html>
