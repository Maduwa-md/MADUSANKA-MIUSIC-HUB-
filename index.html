<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MADUSANKA MIUSIC HUB</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:white;

    background:
    linear-gradient(
        rgba(0,0,0,.72),
        rgba(25,0,40,.82)
    ),
    url("file_0000000044ac81faa36c9dc27ef5a2e6.png")
    center/cover fixed no-repeat;
}

/* ================= LOGIN ================= */

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;

    padding:30px;

    text-align:center;

    background:rgba(15,15,25,.82);

    backdrop-filter:blur(15px);

    border:1px solid #ffffff25;

    border-radius:25px;

    box-shadow:0 15px 50px #000;
}

.logo{
    font-size:clamp(28px,7vw,50px);

    font-weight:900;

    text-shadow:
    0 0 15px #9b00ff,
    0 0 30px #ff1493;
}

.login-box h2{
    margin:18px 0;
}

.input{
    width:100%;

    padding:14px;

    margin:7px 0;

    border:1px solid #ffffff20;

    border-radius:13px;

    background:#ffffff10;

    color:white;

    outline:none;
}

.btn{
    border:0;

    padding:12px 17px;

    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #8500ff,
        #ff1493
    );

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.btn:hover{
    transform:scale(1.03);
}

.login-btn{
    width:100%;
    margin-top:10px;
}


/* ================= APP ================= */

#app{
    display:none;
}

.container{
    width:94%;
    max-width:950px;

    margin:auto;

    padding:20px 0 40px;
}

header{
    text-align:center;

    padding:15px 0 25px;
}

.subtitle{
    color:#ccc;

    margin-top:8px;
}


/* ================= CARD ================= */

.card{
    background:rgba(15,15,25,.73);

    backdrop-filter:blur(14px);

    border:1px solid #ffffff20;

    border-radius:24px;

    padding:20px;

    margin-bottom:18px;

    box-shadow:0 15px 45px #0008;
}


/* ================= TOP ================= */

.topbar{
    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.search{
    flex:1;

    min-width:200px;
}


/* ================= UPLOAD ================= */

.upload-btn{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:12px 17px;

    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #8500ff,
        #ff1493
    );

    font-weight:bold;

    cursor:pointer;
}

input[type="file"]{
    display:none;
}


/* ================= COVER ================= */

.cover{
    width:210px;
    height:210px;

    margin:5px auto 18px;

    border-radius:22px;

    background:
    url("cover.jpg")
    center/cover #222;

    box-shadow:
    0 0 35px #8b00ff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:70px;
}

.song-title{
    text-align:center;

    font-size:23px;

    font-weight:bold;

    word-break:break-word;
}

.artist{
    text-align:center;

    color:#aaa;

    margin-top:6px;
}


/* ================= AUDIO ================= */

audio{
    width:100%;

    margin-top:15px;
}


/* ================= PROGRESS ================= */

.progress-area{
    display:flex;

    align-items:center;

    gap:10px;

    margin:15px 0;
}

.progress-area span{
    min-width:42px;

    text-align:center;

    font-size:13px;

    color:#ccc;
}

#progressBar{
    flex:1;

    height:6px;

    cursor:pointer;

    accent-color:#b000ff;
}


/* ================= VISUALIZER ================= */

.visualizer{
    height:75px;

    display:flex;

    align-items:end;

    justify-content:center;

    gap:4px;

    margin:15px auto;
}

.bar{
    width:6px;

    height:10px;

    border-radius:10px;

    background:
    linear-gradient(
        #ff00d4,
        #7300ff
    );

    animation:
    bounce .6s infinite alternate;

    animation-play-state:paused;
}

.playing .bar{
    animation-play-state:running;
}

@keyframes bounce{

    from{
        height:10px;
    }

    to{
        height:65px;
    }

}


/* ================= CONTROLS ================= */

.controls{
    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:10px;

    margin:15px 0;
}

.like{
    background:#302035;
}

.like.active{
    background:#ff146e;
}


/* ================= VOLUME ================= */

.volume{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    margin:15px;
}

.volume input{
    width:220px;
}


/* ================= PLAYLIST ================= */

.playlist{
    margin-top:20px;
}

.playlist h2{
    margin-bottom:12px;
}

.song{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:14px;

    margin:7px 0;

    border-radius:14px;

    background:#ffffff0c;

    border:1px solid #ffffff10;

    cursor:pointer;

    transition:.2s;
}

.song:hover,
.song.active{
    background:#8500ff55;
}

.song-name{
    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.song-buttons{
    display:flex;

    gap:6px;
}

.mini-btn{
    border:0;

    padding:7px 10px;

    border-radius:9px;

    background:#333;

    color:white;

    cursor:pointer;
}

.mini-btn:hover{
    background:#555;
}

.empty{
    text-align:center;

    color:#999;

    padding:20px;
}


/* ================= FOOTER ================= */

footer{
    text-align:center;

    color:#888;

    font-size:13px;

    margin-top:20px;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .container{
        width:94%;
    }

    .card{
        padding:16px;

        border-radius:20px;
    }

    .logo{
        font-size:28px;
    }

    .cover{
        width:175px;
        height:175px;
    }

    .topbar{
        flex-direction:column;
    }

    .search{
        width:100%;

        min-width:100%;
    }

    .topbar button,
    .upload-btn{
        width:100%;
    }

    .controls{
        flex-direction:column;
    }

    .controls .btn{
        width:100%;
    }

    .progress-area{
        gap:5px;
    }

    .song-buttons{
        flex-shrink:0;
    }

}

</style>
</head>


<body>


<!-- =====================================================
LOGIN PAGE
===================================================== -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="logo">
            🎵
        </div>

        <h2>
            MADUSANKA MIUSIC HUB
        </h2>

        <p style="color:#aaa;margin-bottom:15px">
            Welcome to your Music Hub
        </p>

        <input
            id="username"
            class="input"
            type="text"
            placeholder="Username"
        >

        <input
            id="password"
            class="input"
            type="password"
            placeholder="Password"
        >

        <button
            class="btn login-btn"
            onclick="login()"
        >
            🔐 LOGIN
        </button>

        <p
            id="loginMessage"
            style="color:#ff6b9f;margin-top:10px"
        ></p>

    </div>

</div>



<!-- =====================================================
MAIN APP
===================================================== -->

<div id="app">

<div class="container">


<header>

    <div class="logo">
        🎵 MADUSANKA MIUSIC HUB
    </div>

    <div class="subtitle">
        Your Music • Your Vibe • Your Hub
    </div>

</header>



<!-- =====================================================
SEARCH + ADD SONGS
===================================================== -->

<div class="card">

    <div class="topbar">

        <!-- SEARCH -->

        <input
            id="search"
            class="input search"
            type="search"
            placeholder="🔍 Search songs..."
            oninput="showSongs()"
        >


        <!-- ADD SONGS FROM PHONE -->

        <label class="upload-btn">

            🎵 Add Songs

            <input
                id="musicInput"
                type="file"
                accept="audio/*"
                multiple
            >

        </label>


        <!-- BACKGROUND -->

        <label class="upload-btn">

            🖼️ Background

            <input
                id="backgroundInput"
                type="file"
                accept="image/*"
            >

        </label>


        <button
            class="btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</div>



<!-- =====================================================
PLAYER
===================================================== -->

<div class="card">


    <!-- COVER -->

    <div
        id="cover"
        class="cover"
    >
        🎵
    </div>


    <!-- TITLE -->

    <div
        id="songTitle"
        class="song-title"
    >
        🎧 Select a Song
    </div>


    <div class="artist">
        MADUSANKA MIUSIC HUB
    </div>



    <!-- VISUALIZER -->

    <div
        id="visualizer"
        class="visualizer"
    ></div>



    <!-- AUDIO -->

    <audio
        id="player"
        controls
    ></audio>



    <!-- PROGRESS BAR -->

    <div class="progress-area">

        <span id="currentTime">
            0:00
        </span>

        <input
            id="progressBar"
            type="range"
            min="0"
            max="100"
            value="0"
        >

        <span id="duration">
            0:00
        </span>

    </div>



    <!-- PLAYER BUTTONS -->

    <div class="controls">

        <button
            class="btn"
            onclick="previousSong()"
        >
            ⏮ Previous
        </button>


        <button
            id="likeButton"
            class="btn like"
            onclick="likeSong()"
        >
            ♡ Like
        </button>


        <button
            class="btn"
            onclick="nextSong()"
        >
            Next ⏭
        </button>


        <button
            class="btn"
            onclick="downloadSong()"
        >
            ⬇️ Download
        </button>

    </div>



    <!-- VOLUME -->

    <div class="volume">

        🔊

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

        <span id="volumeText">
            100%
        </span>

    </div>



    <!-- PLAYLIST -->

    <div class="playlist">

        <h2>
            🎧 Playlist
        </h2>

        <div id="songList"></div>

    </div>

</div>



<footer>
    © 2026 MADUSANKA MIUSIC HUB
</footer>


</div>

</div>



<script>

/* =====================================================
GITHUB SONGS

GitHub එකේ:

music/
song1.mp3
song2.mp3
song3.mp3

වගේ files තියෙන්න ඕන.
===================================================== */

const githubSongs = [

    {
        name:"My Song 01",
        file:"music/song1.mp3"
    },

    {
        name:"My Song 02",
        file:"music/song2.mp3"
    },

    {
        name:"My Song 03",
        file:"music/song3.mp3"
    },

    {
        name:"My Song 04",
        file:"music/song4.mp3"
    },

    {
        name:"My Song 05",
        file:"music/song5.mp3"
    }

];



/* =====================================================
USER ADDED SONGS
===================================================== */

let localSongs = [];



/* =====================================================
COMBINED SONG LIST
===================================================== */

function getSongs(){

    return [
        ...githubSongs,
        ...localSongs
    ];

}



/* =====================================================
VARIABLES
===================================================== */

let currentSong = -1;

let likedSongs = new Set();


const player =
document.getElementById("player");

const songTitle =
document.getElementById("songTitle");

const songList =
document.getElementById("songList");

const search =
document.getElementById("search");

const likeButton =
document.getElementById("likeButton");

const visualizer =
document.getElementById("visualizer");

const progressBar =
document.getElementById("progressBar");

const currentTime =
document.getElementById("currentTime");

const duration =
document.getElementById("duration");



/* =====================================================
VISUALIZER BARS
===================================================== */

for(let i=0;i<30;i++){

    const bar =
    document.createElement("div");

    bar.className="bar";

    bar.style.animationDelay =
    (i*0.04)+"s";

    visualizer.appendChild(bar);

}



/* =====================================================
LOGIN
===================================================== */

function login(){

    const username =
    document.getElementById(
        "username"
    ).value.trim();


    const password =
    document.getElementById(
        "password"
    ).value.trim();


    if(
        username === "" ||
        password === ""
    ){

        document.getElementById(
            "loginMessage"
        ).textContent =
        "Username සහ Password දාන්න.";

        return;

    }


    document.getElementById(
        "loginPage"
    ).style.display="none";


    document.getElementById(
        "app"
    ).style.display="block";


    showSongs();

}



/* =====================================================
LOGOUT
===================================================== */

function logout(){

    document.getElementById(
        "app"
    ).style.display="none";


    document.getElementById(
        "loginPage"
    ).style.display="flex";

}



/* =====================================================
ADD SONGS FROM PHONE / PC
===================================================== */

document.getElementById(
    "musicInput"
)
.addEventListener(
    "change",
    function(){

        const files =
        Array.from(this.files);


        files.forEach(
            file=>{

                localSongs.push({

                    name:file.name
                    .replace(
                        /\.[^/.]+$/,
                        ""
                    ),

                    file:
                    URL.createObjectURL(
                        file
                    ),

                    local:true

                });

            }
        );


        showSongs();


        /* First local song */

        if(
            currentSong === -1 &&
            localSongs.length > 0
        ){

            const all =
            getSongs();

            loadSong(
                all.length - localSongs.length
            );

        }


        /* Reset input */

        this.value="";

    }
);



/* =====================================================
SHOW PLAYLIST
===================================================== */

function showSongs(){

    const allSongs =
    getSongs();


    const query =
    search.value.toLowerCase();


    songList.innerHTML="";


    let found=false;


    allSongs.forEach(
        (song,index)=>{

            if(
                !song.name
                .toLowerCase()
                .includes(query)
            ){

                return;

            }


            found=true;


            const row =
            document.createElement("div");


            row.className =
            "song " +
            (
                index === currentSong
                ? "active"
                : ""
            );


            /* SONG NAME */

            const name =
            document.createElement("span");


            name.className =
            "song-name";


            name.textContent =
            (
                likedSongs.has(index)
                ? "❤️ "
                : "🎵 "
            )
            +
            song.name;


            name.onclick =
            ()=>{
                loadSong(index);
            };



            /* BUTTONS */

            const buttons =
            document.createElement("div");


            buttons.className =
            "song-buttons";



            /* DOWNLOAD */

            const download =
            document.createElement("button");


            download.className =
            "mini-btn";


            download.textContent =
            "⬇️";


            download.title =
            "Download";


            download.onclick =
            event=>{

                event.stopPropagation();

                downloadSpecificSong(
                    song
                );

            };



            buttons.appendChild(
                download
            );


            row.appendChild(name);

            row.appendChild(buttons);


            songList.appendChild(row);

        }
    );


    if(!found){

        songList.innerHTML =
        `
        <div class="empty">
            🎵 No songs found
        </div>
        `;

    }

}



/* =====================================================
LOAD SONG
===================================================== */

function loadSong(index){

    const allSongs =
    getSongs();


    if(
        index < 0 ||
        index >= allSongs.length
    ){

        return;

    }


    currentSong=index;


    const song =
    allSongs[index];


    player.src =
    song.file;


    songTitle.textContent =
    song.name;


    progressBar.value=0;


    currentTime.textContent="0:00";

    duration.textContent="0:00";


    updateLike();


    showSongs();


    player.play()
    .catch(
        ()=>{
            /* Browser autoplay restriction */
        }
    );

}



/* =====================================================
NEXT
===================================================== */

function nextSong(){

    const allSongs =
    getSongs();


    if(!allSongs.length)
    return;


    let next =
    currentSong + 1;


    if(
        next >= allSongs.length
    ){

        next=0;

    }


    loadSong(next);

}



/* =====================================================
PREVIOUS
===================================================== */

function previousSong(){

    const allSongs =
    getSongs();


    if(!allSongs.length)
    return;


    let previous =
    currentSong - 1;


    if(previous < 0){

        previous =
        allSongs.length - 1;

    }


    loadSong(previous);

}



/* =====================================================
LIKE
===================================================== */

function likeSong(){

    if(currentSong < 0)
    return;


    if(
        likedSongs.has(currentSong)
    ){

        likedSongs.delete(
            currentSong
        );

    }
    else{

        likedSongs.add(
            currentSong
        );

    }


    updateLike();

    showSongs();

}



/* =====================================================
LIKE BUTTON
===================================================== */

function updateLike(){

    if(
        likedSongs.has(
            currentSong
        )
    ){

        likeButton.textContent =
        "♥ Liked";


        likeButton.classList.add(
            "active"
        );

    }
    else{

        likeButton.textContent =
        "♡ Like";


        likeButton.classList.remove(
            "active"
        );

    }

}



/* =====================================================
DOWNLOAD CURRENT SONG
===================================================== */

function downloadSong(){

    const allSongs =
    getSongs();


    if(currentSong < 0){

        alert(
            "මුලින් සින්දුවක් select කරන්න 🎵"
        );

        return;

    }


    downloadSpecificSong(
        allSongs[currentSong]
    );

}



/* =====================================================
DOWNLOAD SONG
===================================================== */

function downloadSpecificSong(song){

    const link =
    document.createElement("a");


    link.href =
    song.file;


    link.download =
    song.name + ".mp3";


    link.target="_blank";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );

}



/* =====================================================
PROGRESS BAR UPDATE
===================================================== */

player.addEventListener(
    "timeupdate",
    function(){

        if(
            !isNaN(player.duration) &&
            player.duration > 0
        ){

            const percent =
            (
                player.currentTime /
                player.duration
            ) * 100;


            progressBar.value =
            percent;


            currentTime.textContent =
            formatTime(
                player.currentTime
            );

        }

    }
);



/* =====================================================
SONG DURATION
===================================================== */

player.addEventListener(
    "loadedmetadata",
    function(){

        if(
            !isNaN(player.duration)
        ){

            duration.textContent =
            formatTime(
                player.duration
            );

        }

    }
);



/* =====================================================
PROGRESS BAR SEEK
===================================================== */

progressBar.addEventListener(
    "input",
    function(){

        if(
            player.duration &&
            !isNaN(player.duration)
        ){

            player.currentTime =
            (
                progressBar.value /
                100
            )
            *
            player.duration;

        }

    }
);



/* =====================================================
TIME FORMAT
===================================================== */

function formatTime(seconds){

    if(
        isNaN(seconds)
    ){

        return "0:00";

    }


    const minutes =
    Math.floor(
        seconds / 60
    );


    let secs =
    Math.floor(
        seconds % 60
    );


    if(secs < 10){

        secs =
        "0" + secs;

    }


    return minutes + ":" + secs;

}



/* =====================================================
VOLUME
===================================================== */

document.getElementById(
    "volume"
)
.addEventListener(
    "input",
    function(){

        player.volume =
        this.value;


        document.getElementById(
            "volumeText"
        ).textContent =
        Math.round(
            this.value * 100
        ) + "%";

    }
);



/* =====================================================
VISUALIZER
===================================================== */

player.addEventListener(
    "play",
    function(){

        visualizer.classList.add(
            "playing"
        );

    }
);


player.addEventListener(
    "pause",
    function(){

        visualizer.classList.remove(
            "playing"
        );

    }
);



/* =====================================================
AUTO NEXT
===================================================== */

player.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);



/* =====================================================
BACKGROUND UPLOAD
===================================================== */

document.getElementById(
    "backgroundInput"
)
.addEventListener(
    "change",
    function(){

        const file =
        this.files[0];


        if(!file)
        return;


        const image =
        URL.createObjectURL(
            file
        );


        document.body.style.background =
        `
        linear-gradient(
            rgba(0,0,0,.72),
            rgba(25,0,40,.82)
        ),
        url("${image}")
        center/cover fixed
        `;

    }
);

</script>

</body>
  </html>
